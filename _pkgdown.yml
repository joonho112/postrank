url: https://joonho112.github.io/postrank/

template:
  bootstrap: 5
  math-rendering: mathml
  light-switch: false
  bslib:
    primary: "#17645E"

navbar:
  structure:
    left: [intro, vignettes, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/a1-getting-started.html
    vignettes:
      text: Vignettes
      href: articles/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/joonho112/postrank
      aria-label: GitHub

redirects:
- ["articles/quickstart.html", "articles/a1-getting-started.html"]
- ["articles/inputs-and-producers.html", "articles/a5-your-posterior-results.html"]
- ["articles/baselines-and-the-cost-of-a-common-grade.html", "articles/m2-several-criteria.html"]
- ["articles/migration-from-0-9.html", "news/index.html#documentation-and-compatibility-1-3-0"]

articles:
- title: Start here
  desc: Walk through a complete analysis from posterior inputs to integer grades, exported tables, HTML reports, and sensitivity plots.
  navbar: ~
  contents:
  - a1-getting-started
  - a5-your-posterior-results
  - a6-reading-exporting-results
  - a7-figures-sensitivity
- title: Applied examples
  desc: Follow one-criterion and multi-criterion grading analyses across California schools, large U.S. employers, and Alabama counties.
  navbar: ~
  contents:
  - a2-cde-accountability
  - a3-krw-race-gender
  - a4-alabama-opportunity
- title: Methods
  desc: Connect posterior comparison probabilities, integer grades, multiple criteria, exact ties, solver bounds, and Monte Carlo or IID diagnostics.
  navbar: ~
  contents:
  - m1-ranking-and-loss
  - m2-several-criteria
  - m3-posterior-inputs
  - m4-ties-and-withholding
  - m5-computing-grades
  - m6-uncertainty-diagnostics
- title: Multidomain profiles
  desc: Assign each entity a separate grade in each domain and evaluate joint cross-domain error-exceedance protection.
  navbar: ~
  contents:
  - mdomain-quickstart
  - mdomain-decisions
- title: Reference aids
  desc: Browse all seven common-grade figure functions and their display options side by side.
  navbar: ~
  contents:
  - figure-gallery

reference:
- title: Grading and stored examples
  desc: Run a common-grade analysis in one call, load precomputed example results without a solver, or build, solve, and evaluate a grading problem step by step.
  contents:
  - has_concept("decision")
  - postrank_example
- title: Posterior draw inputs
  desc: Describe posterior draws in plain arguments or structured blocks, build and validate draw objects, and read or write draw files.
  contents:
  - has_concept("input")
- title: Analytic posteriors and comparison probabilities
  desc: Compute pairwise directional-error probabilities from draws or normal and mixture posteriors, or supply precomputed comparison probabilities.
  contents:
  - has_concept("coefficients")
- title: Settings and solver control
  desc: Specify reporting loss settings (`weights`, `tau`, `G_max`, error budgets, minimax) and solver time limits, tolerances, and backend availability.
  contents:
  - has_concept("settings")
- title: Tables, accessors, and HTML reports
  desc: Extract assigned grades, pair relations, criterion error profiles, report-card tables, and standalone HTML reports from stored results.
  contents:
  - has_concept("reporting")
- title: Figures and plot helpers
  desc: Draw the seven common-grade ggplot2 figures, extract their underlying data tables, and apply package themes and grade palettes.
  contents:
  - has_concept("visualization")
- title: Baseline rules and method comparison
  desc: Score entities by posterior means, expected ranks, or linear composites, cut fixed orders into grades, and compare rules under one common loss.
  contents:
  - has_concept("baselines")
- title: Sensitivity grids and frontiers
  desc: Trace grades across tau or error-budget frontiers, run grids of reporting settings, and measure the per-criterion cost of sharing one common grade.
  contents:
  - has_concept("grids")
- title: Monte Carlo diagnostics
  desc: Summarize Monte Carlo standard errors, resampling fragility, and out-of-fold loss differences without claiming calibration guarantees.
  contents:
  - has_concept("diagnostics")
- title: Conditional IID bounds and envelopes
  desc: Compute conditional error radii, regret bounds, and protection envelopes that hold only under independent draws with a sample size fixed in advance.
  contents:
  - has_concept("reference")
- title: Multidomain profile report cards
  desc: Assign each entity a separate grade per domain, evaluate additive losses and joint cross-domain error caps over a declared candidate set, and plot profile cards.
  contents:
  - has_concept("multidomain")
- title: Posteriors with exact ties
  desc: Grade entities under posteriors where exact equality between distinct entities has positive probability; see postrank_tie_capabilities() for supported modes.
  contents:
  - has_concept("tie-aware")
- title: Bundled datasets
  desc: Synthetic teaching posteriors and the California school, employer callback, and Alabama county case-study datasets.
  contents:
  - has_concept("data")
- title: Package overview and global options
  desc: Package-level overview and session options (postrank.backend, postrank.verbose, and postrank.lang).
  contents:
  - postrank-package
  - postrank_options
- title: Console text formatters
  desc: Class-checked wrappers that return the same console output lines as format(x) with width and styling controls.
  contents:
  - has_concept("formatters")

news:
  releases: []
