# Ordinary R CMD check on three platforms (Chapter 16). HiGHS is installed explicitly for the
# live HiGHS tests; postrank.backend is not changed, so the resolver tests still assert the
# Gurobi default. Gurobi is not available here: an unlicensed CI run is not Gurobi validation.
name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::highs, gurobi=?ignore
          needs: check
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--timings")'
          error-on: '"warning"'
          upload-snapshots: false
