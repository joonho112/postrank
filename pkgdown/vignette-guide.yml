intro: Choose a practical guide, explore a case study, or read the methods articles in order.
start: Begin with a six-site analysis that grades entities on one criterion and then on two criteria together, followed by guides on preparing inputs, exporting results, and making figures.
descriptions:
  a1-getting-started: Run a complete grading analysis on one criterion and extend it to two criteria.
  a5-your-posterior-results: Prepare posterior draws, normal or mixture moments, JSON files, and comparison probabilities.
  a6-reading-exporting-results: Inspect grades, pair counts, losses, and solver status, and export CSV, RDS, and HTML reports.
  a7-figures-sensitivity: Make the seven common-grade plots and examine sensitivity to tau, G_max, and weights.
  a2-cde-accountability: Grade California schools on chronic absence rates.
  a3-krw-race-gender: Grade large employers on race and gender callback gaps.
  a4-alabama-opportunity: Grade Alabama counties on upward income mobility and adult incarceration.
  m1-ranking-and-loss: Connect posterior comparison probabilities, integer grades, and reporting loss.
  m2-several-criteria: Combine multiple criteria in one common grading and compare against fixed-order baselines.
  m3-posterior-inputs: Match posterior representations and pairwise probabilities to the calculations they support.
  m4-ties-and-withholding: Distinguish exact ties in the posterior from pairs left unordered by a shared grade.
  m5-computing-grades: Choose problem settings and read solver statuses, lower bounds, and optimality gaps.
  m6-uncertainty-diagnostics: Read Monte Carlo standard errors, MCMC diagnostics, cross-fitting, and IID bounds.
  mdomain-quickstart: Build, evaluate, search, and plot a report card with a separate grade in each domain.
  mdomain-decisions: Compare separate domain rules against joint cross-domain error protection.
  figure-gallery: Browse all seven common-grade plot functions and their display options.
